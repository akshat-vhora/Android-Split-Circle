project_id = "splitcircle"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["io.supabase.flutter://callback"]

[auth.email]
double_confirm_changes = false
enable_confirmations = true

[auth.sessions]
timebox = 2592000  # 30 days

[api]
enabled = true
port = 54321
schemas = ["public", "auth", "storage"]

[storage]
enabled = true

[edge_runtime]
enabled = true
policy = "per_worker"
